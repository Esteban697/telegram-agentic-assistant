# Alembic configuration.
#
# The URL is intentionally empty here: `migrations/env.py` takes it from the application's
# configuration (DATABASE_SYNC_URL) so that migrations use exactly the DSN the deployment
# provides, and so that no connection string is ever committed.
#
# Usage (from the repository root, which is where this file lives):
#     alembic upgrade head
#     alembic current
#
# `scripts/migrate.py` wraps these with a pre-flight check and a production guard.

[alembic]
script_location = migrations
prepend_sys_path = .
# Revision files are timestamped so the ordering is obvious in a directory listing.
file_template = %%(rev)s_%%(slug)s
# The URL is set at runtime by env.py from DATABASE_SYNC_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
